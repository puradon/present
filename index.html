<script type="application/json" id="site-data">{"site_name":"店舗せどり⇨Amazonで月利463万までの道","hero_title":"消防士⇨店舗せどりで月利30万⇨Amazon物販で月利463万までの道のり","footer":"© 店舗せどり⇨Amazonで月利463万までの道","show_home":false,"courses":[{"id":"main","title":"無料プレゼント","category":"","sections":[{"title":"無料特典","lessons":[{"id":"L26090401","title":"【1】動画20本超え「Amazon物販で月利500万超え師匠のコンテンツサイト」","blocks":[{"type":"image","src":"images/0102_0099001.webp","alt":""},{"type":"text","text":"師匠の動画やテキストから学べるコンテンツサイトは\n以下の手順で閲覧できます。\n\n①下のボタンからメールアドレスを入力してショウタさんの公式LINEに追加する"},{"type":"button","label":"10大特典を受け取る","url":"https://utage-system.com/p/SFzEbJBL7aN5/8xMCsW1jYhgx"},{"type":"image","src":"images/0103_0100002.webp","alt":""},{"type":"text","text":"②メニュー左上の「10大動画特典プレゼント」を押す"},{"type":"image","src":"images/0104_0101S29229075.jpg","alt":""}]},{"id":"L26090303","title":"【2】月利463万円を達成した3ステップ","blocks":[{"type":"image","src":"images/0095_44633.png","alt":""},{"type":"html","html":"<p>どうもこんにちは、ぷらどんです。<\/p>\n<p>今回は、店舗せどりで月利30万円だった僕が、Amazon刈り取りで月利463万円を達成するまでの流れについて解説しようと思います。<\/p>\n<p>今、店舗せどりで消耗している人、<br>\n  独学に限界を感じている人は、<br>\n  ぜひこのプレゼントを最後まで読んでいただければと思います。<\/p>"},{"type":"html","html":"<p>結論から話します。<br>\n  僕は今、Amazon刈り取りで月利463万円を達成しています。<br>\n  でも元々は店舗せどりで、毎日12時間、土日も関係なく働いて月利30万円という状態でした。<\/p>\n<p><span class=\"marker-yellow\">労働時間は3分の1になったのに、利益は15倍以上になりました。<\/span><br>\n  この差を生んだのは、才能でも運でもありません。<\/p>\n<p>今日はそこに至るまでの3ステップを、できるだけ正直に話していきます。<\/p>"},{"type":"heading","text":"ステップ1 師匠のコンテンツサイトを見た"},{"type":"html","html":"<p>当時の僕は本業で消防士をしながら、副業で店舗せどりを続けていました。<\/p>\n<p>多少の利益は出せるようになっていたものの、毎日12時間働いても月利30万円から抜け出せない。<br>\n  家族3人、住宅ローンもある中で、正直ずっとお金の不安がありました。<\/p>\n<p>子供に何かをやらせてあげたくても、素直に「いいよ」と言ってあげられない、そんな父親ではいたくなかったんです。<\/p>\n<p>そんな中で、SNSでいろんな人の発信を見るようになりました。<br>\n  教材やコンサルの話もたくさん見ましたが、正直どれも似たり寄ったりに感じていました。<\/p>\n<p>そんな中で出会ったのが師匠のコンテンツサイトでした。<br>\n  無料で公開されている対談動画や発信を見ていくうちに、他の人とは指導実績のレベルが全然違うことに気づいたんです。<\/p>\n<p><span class=\"marker-yellow\">売上ではなく月利で実績を見せている<\/span>、そのこと自体が信頼できるなと感じました。<\/p>\n<p>見れば見るほど「この人から学びたい」という気持ちが強くなっていきました。<br>\n  自分の中で、これは軽い気持ちで見ているだけじゃもったいないな、と思うようになったんです。<\/p>"},{"type":"heading","text":"ステップ2 コンサルを受けた"},{"type":"html","html":"<p>コンサルの審査で電話をもらった時のことは今でも覚えています。<br>\n  「なんで受けようと思ったんですか」と聞かれて、僕は正直、軽い理由を答えてしまったんです。<\/p>\n<p>そしたら師匠は、はっきりとこう言いました。<\/p>\n<p><span class=\"marker-yellow\">「それだけの理由でコンサルを受けるのは良くない。しっかり自分から本気で受けたいと思えるようになってから受けるべきです」<\/span><\/p>\n<p>普通なら売り込んでくるはずのところで、逆にそう言われたことに衝撃を受けました。<br>\n  この人は本当にクライアントの成果を考えている人なんだと、そこで初めて心から思えたんです。<\/p>\n<p>そして実際にコンサルが始まって、一番驚いたのはノウハウよりも先にマインドセットを叩き込まれたことでした。<\/p>\n<p>普通のコンサルってノウハウが欲しくて入るじゃないですか。僕も正直そうでした。<br>\n  でも師匠は違った。ノウハウは時代によって変わってしまいますが、その根っこにある考え方は一生使えます。<\/p>\n<p>ここを最初に教わったことが、後々一番大きかったなと今では思います。<\/p>"},{"type":"heading","text":"ステップ3 教わったことを素直に継続した"},{"type":"html","html":"<p>コンサルを受けたからといって、すぐに結果が出たわけではありません。<br>\n  最初に出た利益はたったの350円でした。<\/p>\n<p>それでも、そのプラス350円という数字を何度もスクショして眺めていたのを覚えています。<\/p>\n<p>いざ店舗に行くのをやめるとなると、もしうまくいかなかったら今の30万円すら稼げなくなるんじゃないかという恐怖で、頭がパンパンになる日もありました。<br>\n  前の同僚には「お前にそんなことができるわけないやろ」と笑われたこともあります。<\/p>\n<p>それでも、教わったことを疑わずに続けました。<br>\n  分からないことはグループラインで相談して、フィードバックをもらう。この繰り返しを地道に続けたんです。<\/p>\n<p>そこから<span class=\"marker-yellow\">3ヶ月目に73万円、5ヶ月目に151万円、そして1年後には463万円<\/span>まで伸びました。<\/p>\n<p>月に360時間働いていたのが120時間まで減っているのに、利益は15倍以上になったんです。<\/p>\n<p>この過程で一番大事だったのは、過去のやり方を手放す勇気と、教わったことを素直にやり続けたことだけでした。<br>\n  特別なことは何もしていません。<\/p>"},{"type":"html","html":"<p>もし今、店舗せどりで消耗していて、独学の限界を感じているなら、その気持ちは痛いほどわかります。<br>\n  僕もずっとそうでした。<\/p>\n<p>でも、答えを知っている人から直接学ぶだけで、見える景色は本当に変わります。<\/p>\n<p class=\"thanks\">この記事を参考に、1日でも早く自分の理想の働き方に近づいていただけたら嬉しいです。<br>\n  最後までご覧いただきありがとうございました。<\/p>"},{"type":"html","html":"<p>ステップ1に書いた師匠のコンテンツサイトは、いまも無料で公開されています。<\/p>\n<p>動画20本超え、テキスト教材10万文字超え。<br>\n  まずはここから見てみてください。<\/p>"},{"type":"button","label":"師匠のコンテンツサイトはここから","url":"https://utage-system.com/p/SFzEbJBL7aN5/8xMCsW1jYhgx"}]},{"id":"L26091201","title":"【3】FBA×最強丸投げ外注の秘密","blocks":[{"type":"image","src":"images/gaichu/00_サムネ_FBA丸投げ外注の秘密.png","alt":"FBA×最強丸投げ外注の秘密"},{"type":"html","html":"<p style=\"\">こんにちは、ぷらどんです！<\/p><p style=\"\">動画の中で「セット品を袋に入れたり、プチプチで巻いたり…あの面倒な作業、実はやらずに済む裏技があります」ってお伝えしましたよね。<\/p><p style=\"\">お待たせしました。<br>その正体を、ここでこっそりお話しします！<\/p><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">【この記事でわかること】<br>・その裏技の正体<br>・なぜ「最強」なのか<br>・はじめの一歩（いつ始めるか／何を出すか／誰に頼むか／どう頼むか／依頼文／出したあと）<br>・最後に、スマホのメモに写して使える「スタートチェックリスト」<\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🎁<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">結論、その裏技とは「丸投げ外注」です<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">FBA納品でみんなが消耗している、あの梱包・袋入れ・プチプチ巻き・ラベル貼り。<br><span class=\"marker-yellow\">これ、全部、他の人に丸投げできるんです！<\/span><\/p><span style=\"display:inline-block;font-size:.78em;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#131A22;color:#fff;border:1px solid #FF9900;margin:0 0 8px;\">丸投げできる作業<\/span><div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#fff6df;color:#1a2130;font-weight:700;font-size:.95em;\">📦 梱包<\/span><span style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#fff6df;color:#1a2130;font-weight:700;font-size:.95em;\">🛍️ 袋入れ<\/span><span style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#fff6df;color:#1a2130;font-weight:700;font-size:.95em;\">🫧 プチプチ巻き<\/span><span style=\"display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#fff6df;color:#1a2130;font-weight:700;font-size:.95em;\">🏷️ ラベル貼り<\/span><\/div><p style=\"\">自分は一切手を動かさない。<br>なのに、商品はちゃんと梱包されてAmazonに届く。<\/p><p style=\"margin:0 0 10px;\">「え、そんなのアリなの？」って思いますよね。<br>アリなんです。しかも、やってる人はもう普通にやってます。<\/p><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">⏱️<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">なぜこれが「最強」なのか<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">理由はシンプルで、<span class=\"marker-yellow\">あなたの時間が丸ごと空くからです。<\/span><\/p><p style=\"\">物販の利益って、結局「何を仕入れるか＝リサーチ」で9割決まります。<\/p><p style=\"\">梱包に何時間もかけてる人と、そこを全部任せてリサーチに全振りしてる人。<br>1年後、どっちが伸びてるかって、もう言うまでもないですよね。<\/p><div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px;\"><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">1日4時間<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">僕の労働時間<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">463万円<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">月収（作業を手放してリサーチに集中した結果）<\/span><\/div><\/div><p style=\"margin:0 0 10px;\">僕が1日4時間の労働で月収463万までいけたのも、作業を手放してリサーチに集中したからです！<\/p><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🪜<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">考え方は、この3ステップだけ<\/h2><\/div><div style=\"margin:0 0 12px;\"><div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);margin:0 0 8px;\"><span style=\"flex:0 0 46px;width:46px;height:46px;border-radius:12px;background:#fff6df;display:flex;align-items:center;justify-content:center;font-size:26px;\">🧠<\/span><div><span style=\"display:block;font-size:.78em;font-weight:800;color:#9a6700;letter-spacing:.06em;\">STEP1<\/span><b style=\"font-size:1.05em;\">作業を「仕分ける」<\/b><span style=\"display:block;color:var(--ink-2);font-size:.95em;margin-top:4px;\">自分の頭を使う作業（リサーチ・仕入れ判断）と、誰でもできる手作業（梱包・袋入れ・ラベル）を、はっきり分ける。<\/span><\/div><\/div><div style=\"text-align:center;color:#FF9900;font-weight:800;line-height:1;margin:0 0 8px;\">▼<\/div><div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);margin:0 0 8px;\"><span style=\"flex:0 0 46px;width:46px;height:46px;border-radius:12px;background:#fff6df;display:flex;align-items:center;justify-content:center;font-size:26px;\">🤝<\/span><div><span style=\"display:block;font-size:.78em;font-weight:800;color:#9a6700;letter-spacing:.06em;\">STEP2<\/span><b style=\"font-size:1.05em;\">手作業は「まるっと」手放す<\/b><span style=\"display:block;color:var(--ink-2);font-size:.95em;margin-top:4px;\">面倒な物理作業は、自分でやらない。まるっと任せる。ここを握れると、物販は一気にラクになります。<\/span><\/div><\/div><div style=\"text-align:center;color:#FF9900;font-weight:800;line-height:1;margin:0 0 8px;\">▼<\/div><div style=\"display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2);margin:0 0 0;\"><span style=\"flex:0 0 46px;width:46px;height:46px;border-radius:12px;background:#fff6df;display:flex;align-items:center;justify-content:center;font-size:26px;\">🔍<\/span><div><span style=\"display:block;font-size:.78em;font-weight:800;color:#9a6700;letter-spacing:.06em;\">STEP3<\/span><b style=\"font-size:1.05em;\">空いた時間を、リサーチに全振り<\/b><span style=\"display:block;color:var(--ink-2);font-size:.95em;margin-top:4px;\">生まれた時間を、利益を生む「上流」＝リサーチに全部使う。これで利益はどんどん伸びていきます！<\/span><\/div><\/div><\/div><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🚶<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">はじめの一歩は、ここから<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">「じゃあ具体的に何から？」というところまで書いておきます。<\/p><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">1<\/span><span>まず、いつ始めるか<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">2<\/span><span>出すもの／絶対に出さないもの<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">3<\/span><span>誰に頼むか<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">4<\/span><span>どうやって頼むか：手順書を1本だけ作る<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">5<\/span><span>依頼文（そのまま使えます）<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span st ng:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🎯<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">じゃあ、どうすればいいか<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\"><span class=\"marker-yellow\">一番の近道は、実際にそれをやっている人から、直接やり方を教わることです！<\/span><\/p><p style=\"\">師匠はAmazon物販だけで月利500万超え。<br>その仕組み化のノウハウの中に、この「最強の丸投げ外注に依頼する具体的な方法」まで、まるっと入っています。<\/p><p style=\"\">どこに・どう頼めば、格安で・失敗せず・安定して回せるのか。<br>ここを最短で手に入れられます。<\/p><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">「面倒な作業から解放されて、リサーチに集中する物販」に本気で切り替えたい方は、下のボタンから、師匠に個別で相談できる案内を受け取ってみてください！<\/div><p style=\"\">あなたが「作業マン」を卒業して、次のステージに進むきっかけになれたら、とてもうれしいです。<br>一緒にがんばりましょう！<\/p><p style=\"margin:0 0 10px;\">ぷらどんでした。<\/p><\/div>"},{"type":"button","label":"師匠に個別相談する案内を受け取る","url":"https://utage-system.com/p/SFzEbJBL7aN5/8xMCsW1jYhgx"}]},{"id":"L26100801","title":"【4】店舗せどり卒業ロードマップ","blocks":[{"type":"image","src":"images/sotsugyo/00_サムネ_店舗せどり卒業ロードマップ.png","alt":"店舗せどり卒業ロードマップ"},{"type":"html","html":"<p style=\"\">どうもこんにちは、ぷらどんです。<\/p><p style=\"\">今回は、動画でお話しした「店舗せどりから在宅完結のAmazon刈り取りに切り替える5ステップ」を、<span class=\"marker-yellow\">上から順にチェックしながら進められる形<\/span>にまとめました。<\/p><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">【この記事の使い方】<br>・各STEPの「やること」を、スマホのメモに写して、1つ終えるごとに消していってください。<br>・全部を一度にやらないでください。やる順番は、最初の「進め方の4段階」の段階1からです。<br>・最後に、書き込み用の「最初の1商品ワークシート」があります。<\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🗺️<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">全体図：店舗の一日を、在宅の一日に入れ替える<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">5つのステップは、店舗の一日を朝から順に在宅の一日へ入れ替えていく順番になっています。<\/p><table style=\"width:100%;border-collapse:separate;border-spacing:0 6px;margin:0 0 6px;font-size:.95em;\"><thead><tr><th style=\"text-align:left;color:var(--muted);font-weight:700;padding:0 8px;font-size:.85em;\">店舗の一日<\/th><th><\/th><th style=\"text-align:left;color:var(--muted);font-weight:700;padding:0 8px;font-size:.85em;\">在宅の一日<\/th><\/tr><\/thead><tbody><tr><td style=\"background:var(--surface-2);border-radius:10px 0 0 10px;padding:10px 8px;\">🚗 朝、車で店舗へ<\/td><td style=\"padding:0 6px;font-weight:800;color:#FF9900;\">→<\/td><td style=\"background:#fff6df;color:#1a2130;border-radius:0 10px 10px 0;padding:10px 8px;\"><b>🔍 家でKeepaでリサーチ<\/b><span style=\"display:block;font-size:.78em;color:#9a6700;\">STEP1<\/span><\/td><\/tr><tr><td style=\"background:var(--surface-2);border-radius:10px 0 0 10px;padding:10px 8px;\">🏬 棚の前で探し続ける<\/td><td style=\"padding:0 6px;font-weight:800;color:#FF9900;\">→<\/td><td style=\"background:#fff6df;color:#1a2130;border-radius:0 10px 10px 0;padding:10px 8px;\"><b>🔔 トラッキングに任せる<\/b><span style=\"display:block;font-size:.78em;color:#9a6700;\">STEP2<\/span><\/td><\/tr><tr><td style=\"background:var(--surface-2);border-radius:10px 0 0 10px;padding:10px 8px;\">🧾 レジに並んで買う<\/td><td style=\"padding:0 6px;font-weight:800;color:#FF9900;\">→<\/td><td style=\"background:#fff6df;color:#1a2130;border-radius:0 10px 10px 0;padding:10px 8px;\"><b>🛒 通知が鳴れば自宅で購入<\/b><span style=\"display:block;font-size:.78em;color:#9a6700;\">STEP3<\/span><\/td><\/tr><tr><td style=\"background:var(--surface-2);border-radius:10px 0 0 10px;padding:10px 8px;\">📦 値札を剥がして、夜に自分で納品<\/td><td style=\"padding:0 6px;font-weight:800;color:#FF9900;\">→<\/td><td style=\"background:#fff6df;color:#1a2130;border-radius:0 10px 10px 0;padding:10px 8px;\"><b>🤝 外注先から納品<\/b><span style=\"display:block;font-size:.78em;color:#9a6700;\">STEP4<\/span><\/td><\/tr><tr><td style=\"background:var(--surface-2);border-radius:10px 0 0 10px;padding:10px 8px;\">🏷️ 店舗の頃もAmazonで販売<\/td><td style=\"padding:0 6px;font-weight:800;color:#FF9900;\">→<\/td><td style=\"background:#fff6df;color:#1a2130;border-radius:0 10px 10px 0;padding:10px 8px;\"><b>📈 Amazon（FBA）で販売<\/b><span style=\"display:block;font-size:.78em;color:#9a6700;\">STEP5<\/span><\/td><\/tr><\/tbody><\/table><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🪜<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">進め方：4つの段階（この順番で）<\/h2><\/div><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #c62828;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\"><span class=\"marker-yellow\">いきなり店舗をやめないでください。<\/span> 生活費は店舗で確保しながら、店舗に出る時間の一部を少しずつリサーチに置き換えていきます。引っ越しと同じで、荷物を少しずつ新居に運びながら、旧居の鍵は最後まで持っておく。これが、僕は一番安全だと思っています。<\/div><div style=\"margin:0 0 12px;\"><div style=\"display:flex;gap:12px;align-items:flex-start;margin:0 0 4px;\"><div style=\"display:flex;flex-direction:column;align-items:center;flex:0 0 34px;\"><span style=\"width:34px;height:34px;border-radius:50%;background:#FF9900;color:#131A22;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.9em;\">1<\/span><span style=\"width:3px;flex:1;min-height:28px;background:#FF9900;opacity:.5;margin-top:4px;\"><\/span><\/div><div style=\"padding:4px 0 14px;\"><b style=\"font-size:1.05em;\">段階1　店舗を続けながら1商品から<\/b><span style=\"display:block;color:var(--ink-2);font-size:.95em;margin-top:2px;\">店舗に出る時間の一部で、STEP1の条件で選んだ1商品をトラッキングに入れる。通知が鳴ったら価格の動きを見て買う。買ったらAmazonで売る。この段階なら、店舗の収入をほとんど減らさずにできます。<\/span><\/div><\/div><div style=\"display:flex;gap:12px;align-items:flex-start;margin:0 0 4px;\"><div style=\"display:flex;flex-direction:column;align-items:center;flex:0 0 34px;\"><span style=\"width:34px;height:34px;border-radius:50%;background:#FF9900;color:#131A22;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.9em;\">2<\/span><span style=\"width:3px;flex:1;min-height:28px;background:#FF9900;opacity:.5;margin-top:4px;\"><\/span><\/div><div style=\"padding:4px 0 14px;\"><b style=\"font-size:1.05em;\">段階2　比率を変える<\/b><span style=\"display:block;color:var(--ink-2);font-size:.95em;margin-top:2px;\">通知から購入までを一度体験したら、トラッキングを1日10件から20件のペースで増やす。通知で仕入れる数が増えたら、その分だけ店舗に出る日を減らす。<\/span><\/div><\/div><div style=\"display:flex;gap:12px;align-items:flex-start;margin:0 0 4px;\"><div style=\"display:flex;flex-direction:column;align-items:center;flex:0 0 34px;\"><span style=\"width:34px;height:34px;border-radius:50%;background:#FF9900;color:#131A22;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.9em;\">3<\/span><span style=\"width:3px;flex:1;min-height:28px;background:#FF9900;opacity:.5;margin-top:4px;\"><\/span><\/div><div style=\"padding:4px 0 14px;\"><b style=\"font-size:1.05em;\">段階3　外注を足す（ここでSTEP4）<\/b><span style=\"display:block;color:var(--ink-2);font-size:.95em;margin-top:2px;\">STEP4の合図が出たら外注に出す。手順書だけは合図が出る前に作っておく。最初に出す作業は1種類だけ。<\/span><\/div><\/div><div style=\"display:flex;gap:12px;align-items:flex-start;margin:0 0 4px;\"><div style=\"display:flex;flex-direction:column;align-items:center;flex:0 0 34px;\"><span style=\"width:34px;height:34px;border-radius:50%;background:#FF9900;color:#131A22;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.9em;\">4<\/span><\/div><div style=\"padding:4px 0 14px;\"><b style=\"font-size:1.05em;\">段階4　完全移行<\/b><span style=\"display:block;color:var(--ink-2);font-size:.95em;margin-top:2px;\">在宅の月利が店舗の月利を超えて、それが何ヶ月か続いたら、店舗に行く日をゼロにする。超えるまでは店舗を辞めない。<\/span><\/div><\/div><\/div><p style=\"margin:0 0 10px;\">僕も店舗を回りながら、この切り替えを始めました。もし今、僕が月30万円の店舗せどりに戻されたら、いきなり全部は辞めずにこの順番で1商品から始めます。<\/p><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🔍<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">STEP1　店舗に行く時間を、Keepaのリサーチに変える<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">朝、車で店舗に向かっていた時間を、家でパソコンを開いてKeepaでリサーチする時間に変えます。消えるのは、遠くまで車を走らせる時間。増えるのは、数字で候補を絞り込む時間です。ここで探すのは「今すぐ買う商品」ではなく、<span class=\"marker-yellow\">「値下がりしたら仕入れたい商品」の候補<\/span>です。<\/p><span style=\"display:inline-block;font-size:.78em;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#131A22;color:#fff;border:1px solid #FF9900;margin:0 0 8px;\">準備<\/span><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>パソコン（スマホだけでは厳しい）<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>Keepa（月額がかかりますが、毎日車で走り回ってガソリンを入れていた頃を思うと、払う価値は十分あると僕は感じています）<\/span><\/li><\/ul><p style=\"font-size:.95em;color:var(--ink-2);\">使う機能は「絞り込み」「トラッキング」「価格の動きを見るグラフ」の3つだけです。<\/p><span style=\"display:inline-block;font-size:.78em;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#FF9900;color:#131A22;margin:0 0 8px;\">やること<\/span><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">1<\/span><span>Keepaにログインして「製品ファインダー」（Product Finder）を開く<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">2<\/span><span>「新品 ¥」→「現在」→「から」に 3000 と入れる<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">3<\/span><span>「月間売上トレンド」→「先月の購入」→「から」に 10 と入れる<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">4<\/span><span>「オファー数」→「新品アイテム数」→「現在」→「から」に 2 と入れる<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">5<\/span><span>「製品を探す」を押す<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">6<\/span><span>結果の一覧から、気になる商品を開く（店舗で触ったことのないジャンルでもOK）<\/span><\/li><\/ul><\/div>"},{"type":"image","src":"images/sotsugyo/切り出し/11_新品3000.png","alt":"手順2：「新品 ¥」の「現在」の「から」に 3000"},{"type":"html","html":"<p style=\"font-size:.85em;color:var(--muted);margin:-8px 0 14px;text-align:center;\">手順2：「新品 ¥」の「現在」の「から」に 3000<\/p>"},{"type":"image","src":"images/sotsugyo/切り出し/12_先月の購入10.png","alt":"手順3：「月間売上トレンド」の「先月の購入」の「から」に 10"},{"type":"html","html":"<p style=\"font-size:.85em;color:var(--muted);margin:-8px 0 14px;text-align:center;\">手順3：「月間売上トレンド」の「先月の購入」の「から」に 10<\/p>"},{"type":"image","src":"images/sotsugyo/切り出し/13_オファー数2.png","alt":"手順4：「オファー数」の「新品アイテム数」の「現在」の「から」に 2"},{"type":"html","html":"<p style=\"font-size:.85em;color:var(--muted);margin:-8px 0 14px;text-align:center;\">手順4：「オファー数」の「新品アイテム数」の「現在」の「から」に 2<\/p>"},{"type":"image","src":"images/sotsugyo/04_ProductFinder_結果一覧_ジャンル混在.jpg","alt":"手順5：「製品を探す」を押すと、条件に合う商品だけが出てくる（ゲーム・ミュージック・PC周辺機器・文房具・DVDが混在）"},{"type":"html","html":"<p style=\"font-size:.85em;color:var(--muted);margin:-8px 0 14px;text-align:center;\">手順5：「製品を探す」を押すと、条件に合う商品だけが出てくる（ゲーム・ミュージック・PC周辺機器・文房具・DVDが混在）<\/p>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🧮<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">STEP1の条件　3つの数字の意味（僕の例です）<\/h2><\/div><div style=\"display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 12px;\"><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">3,000円〜<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">新品の価格<\/span><span style=\"display:block;font-size:.8em;color:var(--ink-2);margin-top:6px;line-height:1.5;text-align:left;\">安すぎる商品は、値下がりしても差額がほとんど残らない<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">10回〜<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">過去30日の購入回数<\/span><span style=\"display:block;font-size:.8em;color:var(--ink-2);margin-top:6px;line-height:1.5;text-align:left;\">売れていない商品を最初から拾わない。値下がりしても売れなければ在庫になるだけ<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">2人〜<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">出品者の数<\/span><span style=\"display:block;font-size:.8em;color:var(--ink-2);margin-top:6px;line-height:1.5;text-align:left;\">1人の商品はメーカーが独占している可能性があって、売れにくい<\/span><\/div><\/div><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">この3つはあくまで僕の例。<span class=\"marker-yellow\">仕入れの基準（何を拾って何を見送るかの線引き）の入口<\/span>は、この3つの数字を自分用の数字に直して、1商品を選ぶことです。<\/div><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🛡️<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">STEP1の続き　仕入れる前に、最低限この3点を確認<\/h2><\/div><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>出品規制：自分が出品できない商品ではないか<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>仕入れ先の評価：問題ないか<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>メーカー自身や代理店が出品していないか<\/span><\/li><\/ul><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #c62828;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">メーカーが出している商品は、知的財産権の申し立てが来やすい。アカウントに傷がつくので、ここだけは絶対に避けます。<\/div><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🔔<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">STEP2　トラッキングを、積み上げる<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">候補が出ただけでは、まだ1円にもなっていません。候補は安くなる瞬間を待たないと買えないからです。そこで、見つけた候補に<span class=\"marker-yellow\">「見張り番」<\/span>をつけます。店舗で言えば、気になる棚の前に自分の代わりに立っていてくれる人を、1人ずつ増やしていく感覚です。<\/p><span style=\"display:inline-block;font-size:.78em;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#131A22;color:#fff;border:1px solid #FF9900;margin:0 0 8px;\">入れる前の見分け方（グラフを長い目で見る）<\/span><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>最近も新しく出品する人が出てきているか<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>1年の価格が右肩下がりになっていないか（下がり続ける商品は、安くなっても値段が戻ってくれないことが多い）<\/span><\/li><\/ul><\/div>"},{"type":"image","src":"images/sotsugyo/05_商品ページ_価格の動きのグラフ.jpg","alt":"商品ページの「Amazon価格履歴」のグラフ（1年間表示）。右肩下がりになっていないかを、この長い目で見る"},{"type":"html","html":"<p style=\"font-size:.85em;color:var(--muted);margin:-8px 0 14px;text-align:center;\">商品ページの「Amazon価格履歴」のグラフ（1年間表示）。右肩下がりになっていないかを、この長い目で見る<\/p>"},{"type":"image","src":"images/sotsugyo/06_商品ページ_出品者数と月間販売数のグラフ.jpg","alt":"同じページの下のグラフ。出品者の数（今後のアイテム数）と月間販売数（1年間表示）"},{"type":"html","html":"<p style=\"font-size:.85em;color:var(--muted);margin:-8px 0 14px;text-align:center;\">同じページの下のグラフ。出品者の数（今後のアイテム数）と月間販売数（1年間表示）<\/p>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">✍️<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">STEP2のやること<\/h2><\/div><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">1<\/span><span>「いくらで売れるか」を見積もる（店舗で身につけた相場の感覚がそのまま効く）<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">2<\/span><span>売れる価格から逆算して、利益が残る買値を決める<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">3<\/span><span>商品ページの「商品の追跡」を開く<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">4<\/span><span>「私」の欄（サードパーティの販売者またはAmazonによる新品の価格）に、買値の少し上の価格を入れる<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">5<\/span><span>「追跡開始」を押す。これで見張り番が1人立つ<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">6<\/span><span>1日10件から20件を目安に繰り返す（最初は1商品からで大丈夫）<\/span><\/li><\/ul><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">底値に置くと、そもそも通知が来ません。売れる価格から逆算して、利益が残る買値の少し上に置きます。<\/div><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #c62828;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\"><span class=\"marker-yellow\">数より質<\/span>。いらない商品まで入れると使えない通知ばかりが鳴って、本物の通知まで見なくなります。いらない商品は、その場で消してください。<\/div><div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px;\"><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">月500件<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">質のいい商品を積む目安<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">1,500件<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">3ヶ月で溜まる数<\/span><\/div><\/div><\/div>"},{"type":"image","src":"images/sotsugyo/切り出し/17_商品の追跡_私の欄.png","alt":"手順4〜5：「商品の追跡」の「私」の欄に買値の少し上を入れて「追跡開始」。いちばん上の「ボックスを購入」は別の欄"},{"type":"html","html":"<p style=\"font-size:.85em;color:var(--muted);margin:-8px 0 14px;text-align:center;\">手順4〜5：「商品の追跡」の「私」の欄に買値の少し上を入れて「追跡開始」。いちばん上の「ボックスを購入」は別の欄<\/p>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">💧<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">積み上がる、ということ<\/h2><\/div><p style=\"\">「労働型」は、手を止めたら収益が止まる働き方。「資産型」は、今日した労力が未来の自分を楽にしてくれる形で積み上がっていく働き方です。<\/p><p style=\"margin:0 0 10px;\">店舗せどりは、今日どれだけ棚を見ても明日はまた一から。トラッキングは、入れた分だけ見張り番が増えて、寝ている間も働いてくれます。収入を水だと思ってください。労働型は毎日バケツで水を運ぶ仕事。資産型は毎日少しずつ水道管を延ばす仕事。<span class=\"marker-yellow\">トラッキングに1商品入れるたびに、水道管が1メートル延びる<\/span>イメージです。<\/p><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🛒<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">STEP3　通知が鳴れば、自宅で購入する<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">通知は「買え」の合図ではなく、<span class=\"marker-yellow\">「見に行け」の合図<\/span>です。健康診断の「要再検査」と同じで、まず価格の動きを診てから、買うかどうかを決めます。<\/p><span style=\"display:inline-block;font-size:.78em;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#FF9900;color:#131A22;margin:0 0 8px;\">通知が来たら、この順番で<\/span><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">1<\/span><span>普段の価格を見る<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">2<\/span><span>通知が来たときの価格を見る<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">3<\/span><span>差額を出す<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">4<\/span><span>商品ページのグラフを、期間を短くして見る（STEP2で見たのは長い目、ここは下がっている間の短い動き）<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">5<\/span><span>下がっている間に増えていた出品者が、減り始めているかを見る<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">6<\/span><span>減り始めていれば「戻る」と判断して買う。戻りそうになければ見送る<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">7<\/span><span>買うなら、通知からAmazonの商品ページへ<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">8<\/span><span>「カートに入れる」ボタンが出ていれば数量を選んで購入。出ていなければ新品だけに絞って、いちばん安い出品を選ぶ<\/span><\/li><\/ul><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px;\"><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">5,000円<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">普段の価格（例）<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">3,500円<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">通知の価格（例）<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">1,500円<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">差額（例）<\/span><\/div><\/div><p style=\"font-size:.95em;color:var(--ink-2);\">戻ったところで売れば、この差額から手数料を引いた分が利益です。<\/p><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">買うのが怖いときは、STEP1の出品規制と評価の確認を先にしてください。<span class=\"marker-yellow\">この買うか見送るかの判断が、仕入れの基準です。<\/span><\/div><p style=\"margin:0 0 10px;\">店舗に出向くことも、レジに並ぶことも、車に積むこともなく、自宅にいながら買えます。<\/p><p style=\"font-size:.95em;color:var(--ink-2);\">通知は、Keepaが登録商品を順番に見て回って確認できた時点で届きます（1周およそ1時間が目安）。だから、遅れてでも入れる価値のある商品だけに絞ります。<\/p><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🔧<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">通知が鳴る前の話　登録価格のメンテナンス<\/h2><\/div><p style=\"\">トラッキングで登録した価格は、放置するとズレていきます。<\/p><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>普段の値段が上がった商品は、登録価格も見直す（安いままだと、本来の安値になっても通知が来ない）<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>普段の値段が下がった商品は、登録価格も見直す（高いままだと、利益にならない通知が届く）<\/span><\/li><\/ul><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">手動で直すと、目安として1,000件を月に2回で月30時間ほどかかります。師匠は、自作のツールで、ズレた登録価格を毎日自動で直していて、メンテナンスの時間は0です。もちろん件数が少ないうちは、手作業でもそこまで時間はかかりません。<\/div><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🤝<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">STEP4　外注先から、納品する<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">夜に自分でやっていた納品を含めて、手を動かす作業を手放します。歯医者さんが受付も掃除も全部自分でやっていたら患者さんを診る時間がなくなる。診察＝リサーチと仕入れの判断、受付＝ラベル貼りや梱包です。この STEP は、進め方の段階3で使います。<\/p><span style=\"display:inline-block;font-size:.78em;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#131A22;color:#fff;border:1px solid #FF9900;margin:0 0 8px;\">手放す合図（目安）<\/span><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>納品の作業に1日2時間以上かかっている<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span>「リサーチしたいのに梱包が終わらない」日が週に2日以上ある<\/span><\/li><\/ul><p style=\"font-size:.95em;margin:-4px 0 12px;\">どちらかが出たら、手放すタイミングです。<\/p><span style=\"display:inline-block;font-size:.78em;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#FF9900;color:#131A22;margin:0 0 8px;\">合図が出る前に<\/span><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">1<\/span><span>出す作業を決める：ラベル貼り・梱包・箱詰め（最初に頼むのは1種類だけ）<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">2<\/span><span>出さないものを決める：仕入れの判断・ログイン情報・カード情報（ここは絶対に自分で持つ）<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">3<\/span><span>頼む相手を決める：まず家族と知人 → それでも難しければクラウドソーシング → 納品代行の業者は最後<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">4<\/span><span>手順書を1本作る：パソコンの操作を画面収録しながら、説明を声で録音する形で十分<\/span><\/li><\/ul><span style=\"display:inline-block;font-size:.78em;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#FF9900;color:#131A22;margin:0 0 8px;\">合図が出たら<\/span><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">5<\/span><span>手順書を渡して、1種類の作業から頼む<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">6<\/span><span>最初の数回は横で一緒にやる。慣れるまでは1種類の作業だけ<\/span><\/li><\/ul><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #c62828;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">ログイン情報は「管理が大丈夫か」ではなく、そもそも渡しません。外注さんにお願いするのは、判断のいらない作業だけです。<\/div><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">僕が最初に頼んだのは家族でした。横で一緒にやりながら直接教えられる相手の方が、やり方を直しやすいからです。外注にはお金がかかるので、リサーチに使えた時間と釣り合うかを見ながら進めます。<\/div><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">📈<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">STEP5　Amazonで販売する<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">店舗せどりでAmazonに出している人は、FBAをもう使っている人が多いはず。だからSTEP5で新しく覚えることは、ほとんどありません。変わるのは、<span class=\"marker-yellow\">納品の作業を自分でやらなくなったこと<\/span>だけです。<\/p><p style=\"font-size:.95em;color:var(--ink-2);\">FBAは、商品をAmazonの倉庫に預けておいて、注文が入ったらAmazonが代わりに発送してくれる仕組み。Amazonで仕入れた商品にはもうカタログがあるので、写真を撮る必要も商品説明を書く必要もありません。保管も発送もお客さん対応も、FBAならAmazonがやってくれます。<\/p><span style=\"display:inline-block;font-size:.78em;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:999px;background:#FF9900;color:#131A22;margin:0 0 8px;\">やること<\/span><ul style=\"list-style:none;margin:0 0 12px;padding:0;\"><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">1<\/span><span>FBAで納品する（納品の手順そのものは、このチャンネルの2本目の動画で全部話しています）<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">2<\/span><span>売れたら利益を確認する：利益＝売れた値段 − 仕入れ値 − Amazonの手数料<\/span><\/li><li style=\"display:flex;gap:8px;align-items:flex-start;padding:9px 10px;margin:0 0 6px;border-radius:10px;background:var(--surface-2);\"><span style=\"display:inline-block;flex:0 0 22px;width:22px;height:22px;border:2px solid #9aa4b2;border-radius:6px;margin-top:3px;\"><\/span><span style=\"flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#FF9900;color:#131A22;font-size:.85em;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;\">3<\/span><span>半月以上売れていない商品があれば、値段を見直す（目安）<\/span><\/li><\/ul><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">高単価の商品はFBAにすると、カート（購入ボタン）に自分の出品が載りやすく、手数料を補えることが多い。単価の低い商品は自分で発送した方が利益が残ることもあるので、FBAが正解とは言いきれません。売れていない商品を最初から拾わないので、在庫は残りにくくなります。<\/div><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">📝<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">最初の1商品ワークシート<\/h2><\/div><p style=\"margin:0 0 12px;color:var(--ink-2);\">このシートをスマホのメモに写して、埋めてください。入口は、STEP1の3つの条件を「僕の例の数字」から「自分用の数字」に直して、1商品を選ぶことです。<\/p><table style=\"width:100%;border-collapse:separate;border-spacing:0 5px;font-size:.93em;\"><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">自分用の数字：新品の価格<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円以上<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">自分用の数字：先月の購入<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿回以上<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">自分用の数字：出品者<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿人以上<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">トラッキングに入れた1商品<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿＿＿＿＿<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">普段の価格<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">売れる価格の見込み<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">トラッキングに置いた価格<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">通知の価格<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">差額<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">出品者は減り始めている？<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">はい ・ いいえ<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">買う？見送る？<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">買う ・ 見送る<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">買った値段<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">売れた値段<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">手数料<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円<\/td><\/tr><tr><td style=\"background:#131A22;color:#fff;border-radius:10px 0 0 10px;padding:8px 10px;font-weight:700;width:52%;\">残った利益<\/td><td style=\"background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;\">＿＿＿＿円<\/td><\/tr><\/table><p style=\"margin:10px 0 10px;\">明日、店舗に行く前でいいので、<span class=\"marker-yellow\">1商品だけトラッキングに入れてみてください。<\/span> あなたの一日に「止まっても積み上がる時間」が、初めて1つ生まれます。<\/p><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">🎯<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">いちばん大事なこと　仕入れの基準で9割決まる<\/h2><\/div><p style=\"\">Amazon物販は、<span class=\"marker-yellow\">仕入れの基準で9割決まる<\/span>と僕は思っています。基準とは、何を仕入れて何を見送るかの線引き。どんな商品を、いくらまで下がったら買って、どのくらいで売れる見込みなら仕入れるのかを決めることです。<\/p><p style=\"margin:0 0 10px;\">Keepaは誰が使っても同じ画面が出ます。その画面を見て買う人と見送る人に分かれる、その分かれ目が基準です。STEP1の3つの条件も、STEP3で買うか見送るかも、STEP5の売れる見込みの見極めも、全部この基準の上に乗っています。<\/p><\/div>"},{"type":"html","html":"<div style=\"background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 18px;\"><div style=\"display:flex;align-items:center;gap:10px;margin:0 0 10px;\"><span style=\"flex:0 0 44px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff6df;\">📊<\/span><h2 style=\"font-size:1.35em;font-weight:800;line-height:1.35;margin:0;\">僕の数字<\/h2><\/div><div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px;\"><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">30万円<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">店舗の頃の月利（MAX）<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">152万円<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">電脳を始めて4ヶ月で<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">202万円<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">電脳を始めて6ヶ月で<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">463万円<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">1年で最高の月<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">約1,939万円<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">2025年の年利<\/span><\/div><div style=\"background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;\"><span style=\"display:block;font-size:1.15em;font-weight:800;line-height:1.25;\">1/3<\/span><span style=\"display:block;font-size:.76em;color:var(--muted);margin-top:3px;line-height:1.4;\">働く時間（月360時間→120時間）<\/span><\/div><\/div><p style=\"\">店舗せどりの頃は、毎日12時間、土日も動いていました。電脳せどりを始めて2ヶ月で月利75万円。1年で月利463万円の月もありました（最高月で、毎月ではありません）。<\/p><p style=\"\">数字よりも変わったことがあります。朝は子どもが寝ているうちに出かけて帰る頃にはもう寝ている、そんな毎日だった僕が、今は子どもの「ただいま」に笑顔で「おかえり」と言えます。<\/p><div style=\"margin:0 0 12px;padding:10px 12px;border-left:4px solid #FF9900;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:.95em;\">この数字は、師匠のコンサルを受けて、教わりながら進めた結果です。毎月必ずこうなるとは言いませんが、僕はこうなりました。<\/div><p style=\"margin:0 0 10px;\">最後までご覧いただきありがとうございました。<\/p><\/div>"}]},{"id":"L26090302","title":"【マンガ】月利30万から1年で月利463万、家族との時間を取り戻した物語","blocks":[{"type":"images","src":["images/0004_001.webp","images/0005_002.webp","images/0006_003.webp","images/0007_004.webp","images/0008_005.webp","images/0009_006.webp","images/0010_007.webp","images/0011_008.webp","images/0012_009.webp","images/0013_010.webp","images/0014_011.webp","images/0015_012.webp","images/0016_013.webp","images/0017_014.webp","images/0018_015.webp","images/0019_016.webp","images/0020_017.webp","images/0021_018.webp","images/0022_019.webp","images/0023_020.webp","images/0024_021.webp","images/0025_022.webp","images/0026_023.webp","images/0027_024.webp","images/0028_025.webp","images/0029_026.webp","images/0030_027.webp","images/0031_028.webp","images/0032_029.webp","images/0033_030.webp","images/0034_031.webp","images/0035_032.webp","images/0036_033.webp","images/0037_034.webp","images/0038_035.webp","images/0039_036.webp","images/0040_037.webp","images/0041_038.webp","images/0042_039.webp","images/0043_040.webp","images/0044_041.webp","images/0045_042.webp","images/0046_043.webp","images/0047_044.webp","images/0048_045.webp","images/0049_046.webp","images/0050_047.webp","images/0051_048.webp","images/0052_049.webp","images/0053_050.webp","images/0054_051.webp","images/0055_052.webp","images/0056_053.webp","images/0057_054.webp","images/0058_055.webp","images/0059_056.webp","images/0060_057.webp","images/0061_058.webp","images/0062_059.webp","images/0063_060.webp","images/0064_061.webp","images/0065_062.webp","images/0066_063.webp","images/0067_064.webp","images/0068_065.webp","images/0069_066.webp","images/0070_067.webp","images/0071_068.webp","images/0072_069.webp","images/0073_070.webp","images/0074_071.webp","images/0075_072.webp","images/0076_073.webp","images/0077_074.webp","images/0078_075.webp","images/0079_076.webp","images/0080_077.webp","images/0081_078.webp","images/0082_079.webp","images/0083_080.webp","images/0084_081.webp","images/0085_082.webp","images/0086_083.webp","images/0087_084.webp","images/0088_085.webp","images/0089_086.webp","images/0090_087.webp","images/0091_088.webp","images/0092_089.webp","images/0093_090.webp","images/0094_091.webp"],"max_width":760},{"type":"html","html":"<p>ここまで読んでくれてありがとうございます。<\/p><p>このマンガで描いた月利30万から463万までの道のりは、師匠のコンテンツサイトで語られている内容がベースになっています。<\/p><p>実際に僕が見て人生が変わったサイトなので、続きが気になった方はこちらから見てみてください。<\/p>"},{"type":"button","label":"師匠のコンテンツサイトはここから","url":"https://utage-system.com/p/SFzEbJBL7aN5/8xMCsW1jYhgx"}]}]},{"title":"YouTube","lessons":[{"id":"L26090501","title":"Amazon出品規制解除の手順","blocks":[{"type":"video","url":"https://youtu.be/s4tjsTR-4Pw?si=IDgPSJRRLM5mEqt3","title":"Amazon出品規制解除の手順","embed":true}]},{"id":"L26091001","title":"【実録】月利500万超えプレイヤーの物販コンサル受けてみた","blocks":[{"type":"video","url":"https://youtu.be/tZEkgW5qmKo","title":"【実録】月利500万超えプレイヤーの物販コンサル受けてみた","embed":true},{"type":"html","html":"<p>コンサルの詳細を解説した動画は以下の手順で視聴できます！<\/p><p>①URLから師匠のメルマガに登録<br>②そのまま師匠のLINEに登録する<br>③LINEメニュー右上の「コンサル詳細」を押す<br>↓<\/p><p><a href=\"https://utage-system.com/p/SFzEbJBL7aN5/8xMCsW1jYhgx\" target=\"_blank\" rel=\"noopener\">https://utage-system.com/p/SFzEbJBL7aN5/8xMCsW1jYhgx<\/a><\/p>"}]},{"id":"L26100701","title":"FBA納品手順＆補助ツールも配布して徹底解説","blocks":[{"type":"video","url":"https://youtu.be/olfBxCEYfwM","title":"FBA納品手順＆補助ツールも配布して徹底解説","embed":true}]}]},{"title":"師匠の勉強会レビュー","lessons":[{"id":"L26090601","title":"師匠のAmazon物販勉強会、本人が受講者として本音でレビューします","blocks":[{"type":"text","text":"もし今、店舗せどり月30万、週7日12時間稼働の生活に戻されたら。\n\n正直、二度と戻りたくないです。\n\nこの勉強会、実は僕自身が「実例」として登場してます。ぷらどんという名前で、店舗せどり月30万から4ヶ月で月利151万、今では月利463万まで伸びた事例として紹介されました。だから今回は「外から見て良さそうですよ」というレビューじゃなくて、実際にこの中身をやって人生変わった当事者として、正直に書きます。\n\n対象は、\n\n・師匠のコンサルを受けようか迷っている人\n・店舗せどりで疲弊している人\n・労働型物販に疲弊している人\n・利益が伸び悩んでいる人\n\nこういう、今の状態に満足していない人たちです。"},{"type":"heading","text":"まず結論"},{"type":"text","text":"この勉強会で話されていることは、誇張でも煽りでもなく、僕が実際に体験した変化そのものです。労働型から資産型への切り替えというシンプルな話ですが、その中身がめちゃくちゃ本質を突いていて、聞き終わった後にちゃんと行動できる構成になってます。"},{"type":"heading","text":"店舗せどり時代の話、正直にします"},{"type":"text","text":"勉強会の中でも触れられてましたが、僕は元々週7日、1日12時間、店舗を回って月利30万でした。子供が起きる前に家を出て、子供が寝てから帰る。ガソリン代もかかるし、店員さんの視線も気まずい。それでも月30万。\n\nこれ、店舗せどりをやったことある人なら分かると思うんですけど、しんどいのは金額じゃないんですよね。「今日行くのをやめたら、その分の収益が丸ごと消える」という感覚です。稼げてるのに、なぜか楽になっていかない。\n\nこれ、才能とか根性の問題じゃなくて、単純に「積み上がる手法」を知らなかっただけなんですよね。今ならそう言えます。"},{"type":"heading","text":"勉強会で言われてる「労働型と資産型の違い」は、実感として本当"},{"type":"text","text":"勉強会の核はここです。\n\n・労働型物販：手を止めたら収益も止まる。今日の12時間は、今日のためだけの12時間。\n・資産型物販(Amazon刈り取り)：今日リサーチしてトラッキングした分が、明日以降も通知として積み上がっていく。\n\n僕がまさにこれで変わりました。店舗仕入れのときは「今日どこ回るか」を毎日ゼロから考えてましたが、Amazon刈り取りに切り替えてからは、トラッキングした商品リストがそのまま資産になって、寝てる間も移動中も、勝手に「安くなりました」の通知が来る状態になりました。\n\n勉強会で説明されてた「儲かる物販の三原則」\n\n1. リサーチが資産になる\n2. オールジャンル扱える\n3. 早く売れて在庫になりづらい\n\nこれも実感としてその通りです。特に1番、これに尽きます。店舗せどりって、リサーチした時間が翌日には価値ゼロになるんですよね。今日見た棚は今日限り。Amazon刈り取りは、今日トラッキングした商品が来月も再来月も通知を生み続けます。日々の積み重ねがちゃんと未来の自分を楽にしてくれる、この感覚を最初にちゃんと言語化してくれてるのがすごく良かったです。\n\nKeepaの波形を見て、トラッキングすべき商品かどうかを判断する部分(直近で新規出品者が出てきているか、値上がり後も実際に売れているか)は、僕が師匠の教材で学んだ内容と完全に一致していて、ここは変わらず本質だと思ってます。"},{"type":"heading","text":"「実績」の見方について、僕の立場から言えること"},{"type":"text","text":"勉強会には月利数百万〜1000万超えのクライアント事例がたくさん出てきます。\n\n僕自身がその「事例の一人」なので言えるんですが、僕のグラフは実データです。月30万から始まって、463万まで、月ごとの実績報告をもとに作られたグラフでした。ちゃんと裏付けのある数字が並んでるので、安心して見てもらえる内容だと思います。\n\n勉強会の中で「Aさん月収1000万・利益率5%」より「Bさん月収500万・利益率20%」の方が良い、という話がありましたが、これは物販をやる上で本当に大事な視点です。数字の大きさより、手残りと再現性を大事にする考え方が、随所にちゃんと入ってるのが好きなポイントです。"},{"type":"heading","text":"良かった点"},{"type":"html","html":"<p><strong>マインドセットの比重が大きいこと<\/strong><br>物販ノウハウだけで月利100万に届いた人はほぼいない、という話がありましたが、これこそが本質の話です。僕自身、店舗せどり時代は「ノウハウ」より先に「稼ぎにくい場所で頑張り続ける」というマインドの縛りにハマっていました。この本質の部分に最初に触れてくれるのが、遠回りさせない師匠の優しさだなと思います。<\/p><p><strong>「稼ぎにくい市場で努力を最大化してた」という自己開示<\/strong><br>師匠自身が1年間、メルカリ・楽天ポイントせどり・中古ブランド・店舗せどり・YouTube・メーカー転売と、いろんな手法にチャレンジしてきた話を包み隠さず出してました。これは僕が店舗せどり時代に感じてた「頑張ってるのに稼げない」という感覚と重なる部分で、共感できる人は多いと思います。同じ景色を見てきた人の話だからこそ、説得力があるんだなと感じました。<\/p><p><strong>トラッキングの仕組みの説明が丁寧<\/strong><br>初心者でも「なぜ資産になるのか」が理解できる構成になってました。ここは僕がKeepa波形やプロダクトファインダーで実際にやってることと矛盾なく、初めて聞く人にも分かりやすい説明だったと思います。<\/p><p><strong>なぜAmazon刈り取りがいいのか、データでちゃんと説明してくれてる<\/strong><br>「なんとなく良さそう」で終わらせず、Amazon市場の拡大データや、労働型・資産型それぞれの利益率・即効性・資産性を数字で比較して見せてくれるので、感覚じゃなく根拠で納得できる作りになってます。これがあるから、初心者でも「なぜ他の物販じゃなくてAmazonなのか」がスッと腹落ちすると思います。<\/p><p><strong>行動すれば結果が出る、という誠実な伝え方<\/strong><br>「行動しないと稼げません」ときっぱり伝えてくれてるのも良かったです。楽して誰でも稼げる、みたいな話ではなく、正しい方向に努力すれば結果が出るという、地に足のついたメッセージだったと思います。実際、僕自身がプロダクトファインダーで絞り込んで、トラッキングを積んで、通知が来たら仕入れる、という積み重ねをやり続けて今があるので、この誠実さにはすごく共感します。<\/p>"},{"type":"heading","text":"誰に向いていると思うか(僕の視点で)"},{"type":"text","text":"・店舗せどりで月20〜30万は稼げてるけど、時間を切り売りする生活から抜けたい人\n・労働型でそこそこ稼げてるが、家族との時間や自分の時間をもっと増やしたい人\n・数字の伸び悩みに、根性論ではなく「仕組み」で向き合いたい人\n・ノウハウよりまず「なぜ稼げてないのか」という思考のクセを直したい人\n\nこういう人には、間違いなく刺さる内容だと思います。"},{"type":"heading","text":"最後に、僕から一言"},{"type":"text","text":"この勉強会の内容は、僕が実際に歩いてきた道と嘘なく重なっています。店舗せどりで月30万・週7日12時間の生活から、資産型物販に切り替えて今の状態まで来たのは紛れもない真実です。\n\n正直に言うと、この勉強会に物販を始めたばかりの頃に参加したかったです。そうすれば、店舗せどりで遠回りすることなく、もっと早く資産型物販に出会えていたなと思います。当時の自分を参加させてあげたいくらいです。\n\nもし当時に戻れるとしても、僕は絶対に師匠のもとで再度Amazon刈り取りを学ぶ道を選びます。そう言い切れるくらいこの選択は正解だったと心から思います。\n\n今の店舗せどり、労働型物販に「このままでいいのか」というモヤモヤがあるなら、一度話を聞いてみてほしいです。僕がそうだったように、聞いた後に行動を積み重ねていけば、ちゃんと景色は変わります。"},{"type":"text","text":"気になった方は、下のリンクから勉強会の予約をしてみてください。"},{"type":"button","label":"勉強会の予約はこちら","url":"https://utage-system.com/p/Tzzo15axZBNr/8xMCsW1jYhgx"}]}]}]}]}</script>

  function videoUrl(u){

    if(m)return 'https://www.youtube.com/embed/'+m[1];
