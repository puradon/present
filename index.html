<script type="application/json" id="site-data">{"site_name":"店舗せどり⇨Amazonで月利463万までの道","hero_title":"消防士⇨店舗せどりで月利30万⇨Amazon物販で月利463万までの道のり","footer":"© 店舗せどり⇨Amazonで月利463万までの道","show_home":false,"courses":[{"id":"main","title":"無料プレゼント","category":"","sections":[{"title":"無料特典","lessons":[{"id":"L26090401","title":"【1】動画20本超え「Amazon物販で月利500万超え師匠のコンテンツサイト」","blocks":[{"type":"image","src":"images/0102_0099001.webp","alt":""},{"type":"text","text":"師匠の動画やテキストから学べるコンテンツサイトは\n以下の手順で閲覧できます。\n\n①下のボタンからメールアドレスを入力してショウタさんの公式LINEに追加する"},{"type":"button","label":"10大特典を受け取る（無料）","url":"https://utage-system.com/p/SFzEbJBL7aN5/8xMCsW1jYhgx"},{"type":"image","src":"images/0103_0100002.webp","alt":""},{"type":"text","text":"②メニュー左上の「10大動画特典プレゼント」を押す"},{"type":"image","src":"images/0104_0101S29229075.jpg","alt":""}]},{"id":"L26090303","title":"【2】月利463万円を達成した3ステップ","blocks":[{"type":"image","src":"images/0095_44633.png","alt":""},{"type":"html","html":"<p>どうもこんにちは、ぷらどんです。<\/p>\n<p>今回は、店舗せどりで月利30万円だった僕が、Amazon刈り取りで月利463万円を達成するまでの流れについて解説しようと思います。<\/p>\n<p>今、店舗せどりで消耗している人、<br>\n  独学に限界を感じている人は、<br>\n  ぜひこのプレゼントを最後まで読んでいただければと思います。<\/p>"},{"type":"html","html":"<p>結論から話します。<br>\n  僕は今、Amazon刈り取りで月利463万円を達成しています。<br>\n  でも元々は店舗せどりで、毎日12時間、土日も関係なく働いて月利30万円という状態でした。<\/p>\n<p><span class=\"marker-yellow\">労働時間は3分の1になったのに、利益は15倍以上になりました。<\/span><br>\n  この差を生んだのは、才能でも運でもありません。<\/p>\n<p>今日はそこに至るまでの3ステップを、できるだけ正直に話していきます。<\/p>"},{"type":"heading","text":"ステップ1 師匠のコンテンツサイトを見た"},{"type":"html","html":"<p>当時の僕は本業で消防士をしながら、副業で店舗せどりを続けていました。<\/p>\n<p>多少の利益は出せるようになっていたものの、毎日12時間働いても月利30万円から抜け出せない。<br>\n  家族3人、住宅ローンもある中で、正直ずっとお金の不安がありました。<\/p>\n<p>子供に何かをやらせてあげたくても、素直に「いいよ」と言ってあげられない、そんな父親ではいたくなかったんです。<\/p>\n<p>そんな中で、SNSでいろんな人の発信を見るようになりました。<br>\n  教材やコンサルの話もたくさん見ましたが、正直どれも似たり寄ったりに感じていました。<\/p>\n<p>そんな中で出会ったのが師匠のコンテンツサイトでした。<br>\n  無料で公開されている対談動画や発信を見ていくうちに、他の人とは指導実績のレベルが全然違うことに気づいたんです。<\/p>\n<p><span class=\"marker-yellow\">売上ではなく月利で実績を見せている<\/span>、そのこと自体が信頼できるなと感じました。<\/p>\n<p>見れば見るほど「この人から学びたい」という気持ちが強くなっていきました。<br>\n  自分の中で、これは軽い気持ちで見ているだけじゃもったいないな、と思うようになったんです。<\/p>"},{"type":"heading","text":"ステップ2 コンサルを受けた"},{"type":"html","html":"<p>コンサルの審査で電話をもらった時のことは今でも覚えています。<br>\n  「なんで受けようと思ったんですか」と聞かれて、僕は正直、軽い理由を答えてしまったんです。<\/p>\n<p>そしたら師匠は、はっきりとこう言いました。<\/p>\n<p><span class=\"marker-yellow\">「それだけの理由でコンサルを受けるのは良くない。しっかり自分から本気で受けたいと思えるようになってから受けるべきです」<\/span><\/p>\n<p>普通なら売り込んでくるはずのところで、逆にそう言われたことに衝撃を受けました。<br>\n  この人は本当にクライアントの成果を考えている人なんだと、そこで初めて心から思えたんです。<\/p>\n<p>そして実際にコンサルが始まって、一番驚いたのはノウハウよりも先にマインドセットを叩き込まれたことでした。<\/p>\n<p>普通のコンサルってノウハウが欲しくて入るじゃないですか。僕も正直そうでした。<br>\n  でも師匠は違った。ノウハウは時代によって変わってしまいますが、その根っこにある考え方は一生使えます。<\/p>\n<p>ここを最初に教わったことが、後々一番大きかったなと今では思います。<\/p>"},{"type":"heading","text":"ステップ3 教わったことを素直に継続した"},{"type":"html","html":"<p>コンサルを受けたからといって、すぐに結果が出たわけではありません。<br>\n  最初に出た利益はたったの350円でした。<\/p>\n<p>それでも、そのプラス350円という数字を何度もスクショして眺めていたのを覚えています。<\/p>\n<p>いざ店舗に行くのをやめるとなると、もしうまくいかなかったら今の30万円すら稼げなくなるんじゃないかという恐怖で、頭がパンパンになる日もありました。<br>\n  前の同僚には「お前にそんなことができるわけないやろ」と笑われたこともあります。<\/p>\n<p>それでも、教わったことを疑わずに続けました。<br>\n  分からないことはグループラインで相談して、フィードバックをもらう。この繰り返しを地道に続けたんです。<\/p>\n<p>そこから<span class=\"marker-yellow\">3ヶ月目に73万円、5ヶ月目に151万円、そして1年後には463万円<\/span>まで伸びました。<\/p>\n<p>月に360時間働いていたのが120時間まで減っているのに、利益は15倍以上になったんです。<\/p>\n<p>この過程で一番大事だったのは、過去のやり方を手放す勇気と、教わったことを素直にやり続けたことだけでした。<br>\n  特別なことは何もしていません。<\/p>"},{"type":"html","html":"<p>もし今、店舗せどりで消耗していて、独学の限界を感じているなら、その気持ちは痛いほどわかります。<br>\n  僕もずっとそうでした。<\/p>\n<p>でも、答えを知っている人から直接学ぶだけで、見える景色は本当に変わります。<\/p>\n<p class=\"thanks\">この記事を参考に、1日でも早く自分の理想の働き方に近づいていただけたら嬉しいです。<br>\n  最後までご覧いただきありがとうございました。<\/p>"},{"type":"html","html":"<p>ステップ1に書いた師匠のコンテンツサイトは、いまも無料で公開されています。<\/p>\n<p>動画20本超え、テキスト教材10万文字超え。<br>\n  まずはここから見てみてください。<\/p>"},{"type":"button","label":"師匠のコンテンツサイトはここから（無料）","url":"https://utage-system.com/p/SFzEbJBL7aN5/8xMCsW1jYhgx"}]},{"id":"L26090302","title":"【マンガ】月利30万から1年で月利463万、家族との時間を取り戻した物語","blocks":[{"type":"images","src":["images/0004_001.webp","images/0005_002.webp","images/0006_003.webp","images/000   var IMG=JSON.parse(document.getElementById('img-data').textContent);
  var ICON={arrowLeft:'<svg width="1em" height="1em" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/></svg>',arrowRight:'<svg width="1em" height="1em" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8"/></svg>',chevL:'<svg width="1em" height="1em" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/></svg>',chevR:'<svg width="1em" height="1em" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/></svg>',play:'<svg width="1em" height="1em" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi" viewBox="0 0 16 16"><path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/></svg>',check:'<svg width="1em" height="1em" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi" viewBox="0 0 16 16"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0"/></svg>',list:'<svg width="1em" height="1em" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M5 11.5a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5m-3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2m0 4a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/></svg>',house:'<svg width="1em" height="1em" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi" viewBox="0 0 16 16"><path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/></svg>'};
  var KEY='kaiin_site:'+SITE.site_name;
  var SHOW_HOME=SITE.show_home!==false;      // false: Homeを省き最初のコースから始める
  var $=function(s,r){return (r||document).querySelector(s)};
  var view=$('#view'),appBack=$('#appbar-back');

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function pad(n){return (n<10?'0':'')+n}
  function visited(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
  function markVisited(id){try{var v=visited();if(v.indexOf(id)<0){v.push(id);localStorage.setItem(KEY,JSON.stringify(v))}}catch(e){}}
  function unmarkVisited(id){try{localStorage.setItem(KEY,JSON.stringify(visited().filter(function(x){return x!==id})))}catch(e){}}
  function lessonsOf(c){var a=[];(c.sections||[]).forEach(function(s){(s.lessons||[]).forEach(function(l){a.push({lesson:l,section:s})})});return a}
  function findCourse(id){return (SITE.courses||[]).filter(function(c){return c.id===id})[0]}
  function courseHref(c){return (!SHOW_HOME&&SITE.courses[0]===c)?'#/':'#/course/'+encodeURIComponent(c.id)}
  function lessonHref(c,l){return '#/course/'+encodeURIComponent(c.id)+'/lesson/'+encodeURIComponent(l.id)}
  function imgTag(key,alt){var i=IMG[key];if(!i)return '<p class="empty">[画像が見つかりません: '+esc(key)+']</p>';return '<img src="'+i.data+'" width="'+i.w+'" height="'+i.h+'" loading="lazy" decoding="async" alt="'+esc(alt||'')+'">'}
  function videoUrl(u){
    var m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/))([\w-]{6,})/);
    if(m)return 'https://www.youtube.com/embed/'+m[1];
    m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return 'https://player.vimeo.com/video/'+m[1];
    return u;
  }
  function renderBlocks(blocks){
    return (blocks||[]).map(function(b){
      switch(b.type){
        case 'text':return String(b.text||'').split(/\n{2,}/).map(function(p){return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>'}).join('');
        case 'heading':return '<h2>'+esc(b.text)+'</h2>';
        case 'html':return b.html||'';
        case 'image':return '<figure>'+imgTag(b.src,b.alt)+(b.caption?'<figcaption>'+esc(b.caption)+'</figcaption>':'')+'</figure>';
        case 'images':return '<div class="seq" style="max-width:'+(parseInt(b.max_width,10)||760)+'px">'+(b.src||[]).map(function(s,i){return imgTag(s,(b.alt||'')+' '+(i+1))}).join('')+'</div>';
        case 'button':return '<div class="btn-row"><a class="btn" href="'+esc(b.url)+'" target="_blank" rel="noopener">'+esc(b.label||'こちらをクリック')+' '+ICON.arrowRight+'</a></div>';
        case 'video':
          if(b.embed)return '<div class="video-embed"><iframe src="'+esc(videoUrl(b.url))+'" title="'+esc(b.title||'動画')+'" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div><p style="text-align:center"><a href="'+esc(b.url)+'" target="_blank" rel="noopener">動画が表示されない場合はこちら</a></p>';
          return '<a class="video-card" href="'+esc(b.url)+'" target="_blank" rel="noopener"><span class="play">'+ICON.play+'</span><span><strong>'+esc(b.title||'動画を見る')+'</strong><small>'+esc(b.url)+'</small></span></a>';
        default:return '';
      }
    }).join('');
  }

  function route(){
    var h=location.hash.replace(/^#\/?/,'')||'';
    var parts=h.split('/').map(function(p){try{return decodeURIComponent(p)}catch(e){return p}});
    appBack.hidden=true;
    if(parts[0]==='course'&&parts[1]){
      var c=findCourse(parts[1]);
      if(!c){location.hash='#/';return}
      if(parts[2]==='lesson'&&parts[3])renderLesson(c,parts[3]);else renderCourse(c);
    }else if(SHOW_HOME||!(SITE.courses||[]).length)renderHome();
    else renderCourse(SITE.courses[0]);
    window.scrollTo(0,0);
  }

  function renderHome(){
    document.title=SITE.site_name;
    var v=visited();
    var cats=[];(SITE.courses||[]).forEach(function(c){(c.category||'').split(',').map(function(s){return s.trim()}).filter(Boolean).forEach(function(k){if(cats.indexOf(k)<0)cats.push(k)})});
    var cards=(SITE.courses||[]).map(function(c){
      var ls=lessonsOf(c),done=ls.filter(function(x){return v.indexOf(c.id+'/'+x.lesson.id)>=0}).length,pct=ls.length?Math.round(done/ls.length*100):0;
      var im=c.image&&IMG[c.image]?'<img class="thumb" src="'+IMG[c.image].data+'" alt="">':'<div class="thumb"></div>';
      return '<div class="course-card" data-name="'+esc(c.title)+'" data-cats="'+esc(c.category||'')+'">'+im+'<div class="body"><h2>'+esc(c.title)+'</h2>'+
        '<div class="progress-line" role="progressbar" aria-label="受講進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
        '<span class="chip">'+ls.length+'本 · 受講済み '+done+'</span><a class="btn" href="'+courseHref(c)+'">受講する '+ICON.arrowRight+'</a></div></div>';
    }).join('');
    view.innerHTML='<div class="page"><div class="wrap">'+
      '<section class="home-hero"><p class="eyebrow">コンテンツ</p><h1>'+esc(SITE.hero_title||SITE.site_name)+'</h1></section>'+
      '<div class="tools"><select id="cat" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option>'+cats.map(function(k){return '<option value="'+esc(k)+'">'+esc(k)+'</option>'}).join('')+'</select><input id="q" type="search" placeholder="コースを検索" aria-label="コース検索"></div>'+
      '<div class="course-grid" id="grid">'+(cards||'<div class="empty">コースはまだありません</div>')+'</div></div></div>';
    var q=$('#q'),cat=$('#cat');
    var filter=function(){var s=q.value.trim(),k=cat.value;view.querySelectorAll('.course-card').forEach(function(el){var okQ=s===''||el.getAttribute('data-name').indexOf(s)>=0;var okK=k===''||el.getAttribute('data-cats').split(',').map(function(x){return x.trim()}).indexOf(k)>=0;el.hidden=!(okQ&&okK)})};
    q.addEventListener('input',filter);cat.addEventListener('change',filter);
  }

  function renderCourse(c){
    document.title=c.title+' | '+SITE.site_name;
    if(SHOW_HOME){appBack.hidden=false;appBack.href='#/';appBack.innerHTML=ICON.house+' Home'}
    var v=visited(),all=lessonsOf(c),done=all.filter(function(x){return v.indexOf(c.id+'/'+x.lesson.id)>=0}).length,pct=all.length?Math.round(done/all.length*100):0;
    var n=0;
    var groups=(c.sections||[]).map(function(s){
      var items=(s.lessons||[]).map(function(l){n++;var isDone=v.indexOf(c.id+'/'+l.id)>=0;
        return '<li><a class="lesson-card" href="'+lessonHref(c,l)+'"><span class="num">'+pad(n)+'</span><span><span class="ttl">'+esc(l.title)+'</span><span class="sub">'+(isDone?'<span class="done">'+ICON.check+' 受講済み</span>':'<span>未受講</span>')+'</span></span><span class="go">'+(isDone?'もう一度見る':'受講する')+' '+ICON.chevR+'</span></a></li>'}).join('');
      return '<section class="group"><h2 class="group-title">'+esc(s.title)+'</h2><ol class="lesson-list">'+(items||'<li class="empty">コンテンツはまだありません</li>')+'</ol></section>';
    }).join('');
    var others=(SITE.courses||[]).filter(function(x){return x!==c});
    view.innerHTML='<div class="page"><div class="wrap">'+
      '<section class="hero"><p class="eyebrow">'+esc(c.category||'コンテンツ一覧')+'</p><h1>'+esc(c.title)+'</h1>'+(c.lead||(!SHOW_HOME&&SITE.hero_title)?'<p class="lead">'+esc(c.lead||SITE.hero_title)+'</p>':'')+
      '<div class="hero-meta"><span class="chip">全 '+all.length+' 本</span><span class="chip'+(done&&done===all.length?' ok':'')+'">'+(done===all.length&&all.length?ICON.check+' すべて受講済み':'受講済み '+done+' / '+all.length)+'</span></div>'+
      '<div class="progress-line" role="progressbar" aria-label="受講進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div></section>'+
      (groups||'<div class="empty">コンテンツはまだありません</div>')+
      (others.length&&!SHOW_HOME?'<section class="other-courses"><h2 class="group-title">他のコース</h2><ul>'+others.map(function(x){return '<li><a href="'+courseHref(x)+'">'+esc(x.title)+' '+ICON.chevR+'</a></li>'}).join('')+'</ul></section>':'')+
      '</div></div>';
  }

  function renderLesson(c,lid){
    var all=lessonsOf(c),idx=-1;
    all.forEach(function(x,i){if(x.lesson.id===lid)idx=i});
    if(idx<0){location.hash=courseHref(c);return}
    var L=all[idx].lesson,S=all[idx].section,prev=all[idx-1],next=all[idx+1];
    document.title=L.title+' | '+SITE.site_name;
    appBack.hidden=false;appBack.href=courseHref(c);appBack.innerHTML=ICON.list+' 一覧';
    var pcard=function(x,cls,label,icon){
      if(!x)return '<span class="pager-card '+cls+' disabled"><small>'+(cls==='prev'?icon+' '+label:label+' '+icon)+'</small><strong>—</strong></span>';
      return '<a class="pager-card '+cls+'" href="'+lessonHref(c,x.lesson)+'"><small>'+(cls==='prev'?icon+' '+label:label+' '+icon)+'</small><strong>'+esc(x.lesson.title)+'</strong></a>';
    };
    view.innerHTML=
      '<div class="page"><div class="wrap"><article>'+
      '<header class="lesson-head"><p class="eyebrow">'+esc(S.title)+'</p><h1>'+esc(L.title)+'</h1></header>'+
      '<div class="content">'+renderBlocks(L.blocks)+'</div>'+
      '<div class="done-box" id="done-box"></div>'+
      '<nav class="pager" aria-label="前後のコンテンツ">'+pcard(prev,'prev','前のコンテンツ',ICON.chevL)+pcard(next,'next','次のコンテンツ',ICON.chevR)+'</nav>'+
      '<div class="end-actions"><a class="btn ghost" href="'+courseHref(c)+'">'+ICON.list+' コンテンツ一覧に戻る</a></div>'+
      '</article></div></div>';
    var key=c.id+'/'+lid,box=$('#done-box');
    var paint=function(){
      var d=visited().indexOf(key)>=0;
      box.innerHTML=d
        ?'<div class="done-state">'+ICON.check+' このコンテンツは受講済みです</div><button type="button" class="btn ghost small" id="done-btn">受講済みを取り消す</button>'
        :'<button type="button" class="btn big" id="done-btn">'+ICON.check+' 受講済みにする</button>';
      $('#done-btn').addEventListener('click',function(){d?unmarkVisited(key):markVisited(key);paint()});
    };
    paint();
  }

  $('#brand').textContent=SITE.site_name;
  $('#footer-text').textContent=SITE.footer||('© '+SITE.site_name);
  window.addEventListener('hashchange',route);
  route();

  // ?debug を付けて開くと表示環境の数値を画面左上に出す（表示崩れの調査用）
  if(/debug/.test(location.search)){
    var sc=document.getElementById('scroller');
    document.documentElement.style.background='#ff00ff';
    sc.style.outline='4px solid red';sc.style.outlineOffset='-4px';
    var d=document.createElement('div');
    d.style.cssText='position:fixed;left:0;top:64px;z-index:9999;background:rgba(0,0,0,.85);color:#0f0;font:12px/1.4 monospace;padding:6px 8px;white-space:pre;pointer-events:none;max-width:95vw;overflow:hidden';
    document.body.appendChild(d);
    var upd=function(){var vv=window.visualViewport;var r=sc.getBoundingClientRect();
      d.textContent='inner '+innerWidth+'x'+innerHeight+'  outer '+outerWidth+'x'+outerHeight+'\n'+
        'visualViewport '+(vv?Math.round(vv.width)+'x'+Math.round(vv.height)+' offsetTop='+Math.round(vv.offsetTop)+' scale='+vv.scale.toFixed(2):'none')+'\n'+
        'screen '+screen.width+'x'+screen.height+' avail '+screen.availHeight+' dpr='+devicePixelRatio+'\n'+
        'html client/scroll '+document.documentElement.clientHeight+'/'+document.documentElement.scrollHeight+' scrollY='+Math.round(scrollY)+'\n'+
        'scroller rect top='+Math.round(r.top)+' bottom='+Math.round(r.bottom)+' h='+Math.round(r.height)+'\n'+
        'scroller client/scroll '+sc.clientHeight+'/'+sc.scrollHeight+' scrollTop='+Math.round(sc.scrollTop)+'\n'+
        'UA '+navigator.userAgent.replace(/Mozilla\/5\.0 /,'').slice(0,90);};
    upd();addEventListener('resize',upd);addEventListener('scroll',upd);
    if(window.visualViewport){visualViewport.addEventListener('resize',upd);visualViewport.addEventListener('scroll',upd)}
    setInterval(upd,1000);
  }
})();
</script>
