        case 'video':
          if(b.embed)return '<div class="video-embed"><iframe src="'+esc(videoUrl(b.url))+'" title="'+esc(b.title||'動画')+'" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div><p style="text-align:center"><a href="'+esc(b.url)+'" target="_blank" rel="noopener">動画が表示されない場合はこちら</a></p>';
          return '<a class="video-card" href="'+esc(b.url)+'" target="_blank" rel="noopener"><span class="play">'+ICON.play+'</span><span><strong>'+esc(b.title||'動画を見る')+'</strong><small>'+esc(b.url)+'</small></span></a>';
        default:return '';
      }
    }).join('');
  }

  function route(){
    var h=location.hash.replace(/^#\/?/,'')||'';
    var parts=h.split('/').map(function(p){try{return decodeURIComponent(p)}catch(e){return p}});
    appBack.hidden=true;
    if(parts[0]==='course'&&parts[1]){
      var c=findCourse(parts[1]);
      if(!c){location.hash='#/';return}
      if(parts[2]==='lesson'&&parts[3])renderLesson(c,parts[3]);else renderCourse(c);
    }else if(SHOW_HOME||!(SITE.courses||[]).length)renderHome();
    else renderCourse(SITE.courses[0]);
    window.scrollTo(0,0);
  }

  function renderHome(){
    document.title=SITE.site_name;
    var v=visited();
    var cats=[];(SITE.courses||[]).forEach(function(c){(c.category||'').split(',').map(function(s){return s.trim()}).filter(Boolean).forEach(function(k){if(cats.indexOf(k)<0)cats.push(k)})});
    var cards=(SITE.courses||[]).map(function(c){
      var ls=lessonsOf(c),done=ls.filter(function(x){return v.indexOf(c.id+'/'+x.lesson.id)>=0}).length,pct=ls.length?Math.round(done/ls.length*100):0;
      var im=c.image&&IMG[c.image]?'<img class="thumb" src="'+IMG[c.image].data+'" alt="">':'<div class="thumb"></div>';
      return '<div class="course-card" data-name="'+esc(c.title)+'" data-cats="'+esc(c.category||'')+'">'+im+'<div class="body"><h2>'+esc(c.title)+'</h2>'+
        '<div class="progress-line" role="progressbar" aria-label="受講進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
        '<span class="chip">'+ls.length+'本 · 受講済み '+done+'</span><a class="btn" href="'+courseHref(c)+'">受講する '+ICON.arrowRight+'</a></div></div>';
    }).join('');
    view.innerHTML='<div class="page"><div class="wrap">'+
      '<section class="home-hero"><p class="eyebrow">コンテンツ</p><h1>'+esc(SITE.hero_title||SITE.site_name)+'</h1></section>'+
      '<div class="tools"><select id="cat" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option>'+cats.map(function(k){return '<option value="'+esc(k)+'">'+esc(k)+'</option>'}).join('')+'</select><input id="q" type="search" placeholder="コースを検索" aria-label="コース検索"></div>'+
      '<div class="course-grid" id="grid">'+(cards||'<div class="empty">コースはまだありません</div>')+'</div></div></div>';
    var q=$('#q'),cat=$('#cat');
    var filter=function(){var s=q.value.trim(),k=cat.value;view.querySelectorAll('.course-card').forEach(function(el){var okQ=s===''||el.getAttribute('data-name').indexOf(s)>=0;var okK=k===''||el.getAttribute('data-cats').split(',').map(function(x){return x.trim()}).indexOf(k)>=0;el.hidden=!(okQ&&okK)})};
    q.addEventListener('input',filter);cat.addEventListener('change',filter);
  }

  function renderCourse(c){
    document.title=c.title+' | '+SITE.site_name;
    if(SHOW_HOME){appBack.hidden=false;appBack.href='#/';appBack.innerHTML=ICON.house+' Home'}
    var v=visited(),all=lessonsOf(c),done=all.filter(function(x){return v.indexOf(c.id+'/'+x.lesson.id)>=0}).length,pct=all.length?Math.round(done/all.length*100):0;
    var n=0;
    var groups=(c.sections||[]).map(function(s){
      var items=(s.lessons||[]).map(function(l){n++;var isDone=v.indexOf(c.id+'/'+l.id)>=0;
        return '<li><a class="lesson-card" href="'+lessonHref(c,l)+'"><span class="num">'+pad(n)+'</span><span><span class="ttl">'+esc(l.title)+'</span><span class="sub">'+(isDone?'<span class="done">'+ICON.check+' 受講済み</span>':'<span>未受講</span>')+'</span></span><span class="go">'+(isDone?'もう一度見る':'受講する')+' '+ICON.chevR+'</span></a></li>'}).join('');
      return '<section class="group"><h2 class="group-title">'+esc(s.title)+'</h2><ol class="lesson-list">'+(items||'<li class="empty">コンテンツはまだありません</li>')+'</ol></section>';
    }).join('');
    var others=(SITE.courses||[]).filter(function(x){return x!==c});
    view.innerHTML='<div class="page"><div class="wrap">'+
      '<section class="hero"><p class="eyebrow">'+esc(c.category||'コンテンツ一覧')+'</p><h1>'+esc(c.title)+'</h1>'+(c.lead||(!SHOW_HOME&&SITE.hero_title)?'<p class="lead">'+esc(c.lead||SITE.hero_title)+'</p>':'')+
      '<div class="hero-meta"><span class="chip">全 '+all.length+' 本</span><span class="chip'+(done&&done===all.length?' ok':'')+'">'+(done===all.length&&all.length?ICON.check+' すべて受講済み':'受講済み '+done+' / '+all.length)+'</span></div>'+
      '<div class="progress-line" role="progressbar" aria-label="受講進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div></section>'+
      (groups||'<div class="empty">コンテンツはまだありません</div>')+
      (others.length&&!SHOW_HOME?'<section class="other-courses"><h2 class="group-title">他のコース</h2><ul>'+others.map(function(x){return '<li><a href="'+courseHref(x)+'">'+esc(x.title)+' '+ICON.chevR+'</a></li>'}).join('')+'</ul></section>':'')+
      '</div></div>';
  }

  function renderLesson(c,lid){
    var all=lessonsOf(c),idx=-1;
    all.forEach(function(x,i){if(x.lesson.id===lid)idx=i});
    if(idx<0){location.hash=courseHref(c);return}
    var L=all[idx].lesson,S=all[idx].section,prev=all[idx-1],next=all[idx+1];
    document.title=L.title+' | '+SITE.site_name;
    appBack.hidden=false;appBack.href=courseHref(c);appBack.innerHTML=ICON.list+' 一覧';
    var pcard=function(x,cls,label,icon){
      if(!x)return '<span class="pager-card '+cls+' disabled"><small>'+(cls==='prev'?icon+' '+label:label+' '+icon)+'</small><strong>—</strong></span>';
      return '<a class="pager-card '+cls+'" href="'+lessonHref(c,x.lesson)+'"><small>'+(cls==='prev'?icon+' '+label:label+' '+icon)+'</small><strong>'+esc(x.lesson.title)+'</strong></a>';
    };
    view.innerHTML=
      '<div class="page"><div class="wrap"><article>'+
      '<header class="lesson-head"><p class="eyebrow">'+esc(S.title)+'</p><h1>'+esc(L.title)+'</h1></header>'+
      '<div class="content">'+renderBlocks(L.blocks)+'</div>'+
      '<div class="done-box" id="done-box"></div>'+
      '<nav class="pager" aria-label="前後のコンテンツ">'+pcard(prev,'prev','前のコンテンツ',ICON.chevL)+pcard(next,'next','次のコンテンツ',ICON.chevR)+'</nav>'+
      '<div class="end-actions"><a class="btn ghost" href="'+courseHref(c)+'">'+ICON.list+' コンテンツ一覧に戻る</a></div>'+
      '</article></div></div>';
    var key=c.id+'/'+lid,box=$('#done-box');
    var paint=function(){
      var d=visited().indexOf(key)>=0;
      box.innerHTML=d
        ?'<div class="done-state">'+ICON.check+' このコンテンツは受講済みです</div><button type="button" class="btn ghost small" id="done-btn">受講済みを取り消す</button>'
        :'<button type="button" class="btn big" id="done-btn">'+ICON.check+' 受講済みにする</button>';
      $('#done-btn').addEventListener('click',function(){d?unmarkVisited(key):markVisited(key);paint()});
    };
    paint();
  }

  $('#brand').textContent=SITE.site_name;
  $('#footer-text').textContent=SITE.footer||('© '+SITE.site_name);
  window.addEventListener('hashchange',route);
  route();

  // ?debug を付けて開くと表示環境の数値を画面左上に出す（表示崩れの調査用）
  if(/debug/.test(location.search)){
    var sc=document.getElementById('scroller');
    document.documentElement.style.background='#ff00ff';
    sc.style.outline='4px solid red';sc.style.outlineOffset='-4px';
    var d=document.createElement('div');
    d.style.cssText='position:fixed;left:0;top:64px;z-index:9999;background:rgba(0,0,0,.85);color:#0f0;font:12px/1.4 monospace;padding:6px 8px;white-space:pre;pointer-events:none;max-width:95vw;overflow:hidden';
    document.body.appendChild(d);
    var upd=function(){var vv=window.visualViewport;var r=sc.getBoundingClientRect();
      d.textContent='inner '+innerWidth+'x'+innerHeight+'  outer '+outerWidth+'x'+outerHeight+'\n'+
        'visualViewport '+(vv?Math.round(vv.width)+'x'+Math.round(vv.height)+' offsetTop='+Math.round(vv.offsetTop)+' scale='+vv.scale.toFixed(2):'none')+'\n'+
        'screen '+screen.width+'x'+screen.height+' avail '+screen.availHeight+' dpr='+devicePixelRatio+'\n'+
        'html client/scroll '+document.documentElement.clientHeight+'/'+document.documentElement.scrollHeight+' scrollY='+Math.round(scrollY)+'\n'+
        'scroller rect top='+Math.round(r.top)+' bottom='+Math.round(r.bottom)+' h='+Math.round(r.height)+'\n'+
        'scroller client/scroll '+sc.clientHeight+'/'+sc.scrollHeight+' scrollTop='+Math.round(sc.scrollTop)+'\n'+
        'UA '+navigator.userAgent.replace(/Mozilla\/5\.0 /,'').slice(0,90);};
    upd();addEventListener('resize',upd);addEventListener('scroll',upd);
    if(window.visualViewport){visualViewport.addEventListener('resize',upd);visualViewport.addEventListener('scroll',upd)}
    setInterval(upd,1000);
  }
})();
</script>
